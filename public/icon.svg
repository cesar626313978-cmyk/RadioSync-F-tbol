<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer broadcast pulse rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#10b981" stroke-width="6" opacity="0.25" stroke-dasharray="16 12" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="#10b981" stroke-width="8" opacity="0.45" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#34d399" stroke-width="8" opacity="0.7" />

  <!-- Central Football shape -->
  <circle cx="256" cy="256" r="95" fill="#f8fafc" filter="url(#glow)" />
  
  <!-- Football pentagons and seams -->
  <polygon points="256,220 285,241 274,275 238,275 227,241" fill="#0f172a" />
  <line x1="256" y1="220" x2="256" y2="161" stroke="#0f172a" stroke-width="7" stroke-linecap="round" />
  <line x1="285" y1="241" x2="341" y2="223" stroke="#0f172a" stroke-width="7" stroke-linecap="round" />
  <line x1="274" y1="275" x2="309" y2="333" stroke="#0f172a" stroke-width="7" stroke-linecap="round" />
  <line x1="238" y1="275" x2="203" y2="333" stroke="#0f172a" stroke-width="7" stroke-linecap="round" />
  <line x1="227" y1="241" x2="171" y2="223" stroke="#0f172a" stroke-width="7" stroke-linecap="round" />

  <!-- Radio antenna beacon badge top-right -->
  <circle cx="370" cy="140" r="32" fill="#10b981" />
  <path d="M360 148 L370 128 L380 148 Z" fill="#022c22" />
  <circle cx="370" cy="151" r="3.5" fill="#022c22" />
  <!-- Signal waves on badge -->
  <path d="M386 130 A 18 18 0 0 1 386 150" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <path d="M393 124 A 26 26 0 0 1 393 156" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8" />
</svg>
